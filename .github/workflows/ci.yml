name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa2', 'pa3']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

  # PA#3 criterion 2: the nine sandbox attacks need Docker, so they run here
  # and not in `npm test` (which must pass with the network cut).
  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build sandbox image
        run: docker build -t leetkob-sandbox:test sandbox

      - name: Attack tests
        run: npm run test:sandbox
