# Local development stack (PA#3).
# Production uses Render (web) + Oracle VM (worker) + Neon (Postgres).

services:
  web:
    build: .
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  worker:
    build: .
    command: node worker/index.js
    env_file: .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leetkob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetkob}
      POSTGRES_DB: leetkob
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  pgdata:
